[project]
name = "ed-fi-sdk-mcp"
version = "0.1.0"
description = "Ed-Fi Software Development Kit MCP Server (Python port)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Ed-Fi Alliance, LLC" }]
keywords = ["mcp", "ed-fi", "api", "data-standard"]
dependencies = [
    "mcp>=1.28.0,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Ed-Fi-Alliance-OSS/Ed-Fi-SDK-MCP"
Repository = "https://github.com/Ed-Fi-Alliance-OSS/Ed-Fi-SDK-MCP.git"

[project.scripts]
ed-fi-sdk-mcp = "ed_fi_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ed_fi_mcp*"]
